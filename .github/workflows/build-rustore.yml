name: Build Khvataika AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless wget unzip

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          wget -q "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -O /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/cmdline-tools/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/godot"

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          wget -q "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates
          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          cp -R /tmp/godot_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          printf '%s\n' "${GODOT_VERSION}.stable" > "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"

          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_release.apk"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"
          test -f "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/version.txt"

          echo "Godot and export templates ready"

      - name: Install project Gradle template
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android
          mkdir -p android/build

          unzip -q "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" -d android/build

          chmod +x android/build/gradlew

          test -f android/build/gradlew
          test -f android/build/settings.gradle
          test -f android/build/build.gradle
          test -f android/build/src/main/AndroidManifest.xml

          echo "Project Gradle template ready"

      - name: Prepare Android notification template
        shell: bash
        run: |
          set -euo pipefail

          JAVA_TEMPLATE="addons/khvataika_background_notifications/KhvataikaAlarmReceiver.java"
          JAVA_TARGET="android/build/src/main/java/com/clawneon/khvataika/KhvataikaAlarmReceiver.java"
          MANIFEST="android/build/src/main/AndroidManifest.xml"

          test -f "$JAVA_TEMPLATE"
          test -f "$MANIFEST"

          mkdir -p "$(dirname "$JAVA_TARGET")"
          cp "$JAVA_TEMPLATE" "$JAVA_TARGET"

          python3 - <<'PY2'
from pathlib import Path

p = Path("android/build/src/main/AndroidManifest.xml")
s = p.read_text()

perms = [
    '    <uses-permission android:name="android.permission.INTERNET" />',
    '    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
    '    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
]

for perm in perms:
    if perm not in s:
        pos = s.find(">")
        if pos >= 0:
            s = s[:pos+1] + "\n" + perm + s[pos+1:]

if "com.clawneon.khvataika.KhvataikaAlarmReceiver" not in s:
    receiver = (
        "\n        <receiver\n"
        "            android:name=\"com.clawneon.khvataika.KhvataikaAlarmReceiver\"\n"
        "            android:enabled=\"true\"\n"
        "            android:exported=\"false\">\n"
        "            <intent-filter>\n"
        "                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />\n"
        "                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />\n"
        "            </intent-filter>\n"
        "        </receiver>\n"
    )

    pos = s.rfind("</application>")

    if pos >= 0:
        s = s[:pos] + receiver + s[pos:]

p.write_text(s)
PY2

          test -f "$JAVA_TARGET"
          test -f "$MANIFEST"

          echo "Android notification template prepared"

      - name: Check project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          grep -q 'name="Android RuStore AAB"' export_presets.cfg
          grep -q 'textures/vram_compression/import_etc2_astc=true' project.godot

          test -f audio/claw_move.wav
          test -s audio/claw_move.wav

          echo "Project configuration OK"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUSTORE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s'
