name: Build Khvataika AAB

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    env:
      GODOT_VERSION: "4.7.2"
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless wget unzip

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mv \
            /tmp/cmdline-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/godot"

          mv \
            "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$HOME/godot/godot"

          chmod +x "$HOME/godot/godot"

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q /tmp/templates.tpz -d /tmp/godot_templates

          cp -R \
            /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          test -f \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"

          echo "Godot and export templates ready"

      - name: Install project Gradle template
        shell: bash
        run: |
          set -euo pipefail

          rm -rf android
          mkdir -p android/build

          unzip -q \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip" \
            -d android/build

          echo "Searching for Gradle project..."

          GRADLEW="$(find android/build -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found"
            find android/build -maxdepth 5 -type f | head -100
            exit 1
          fi

          SOURCE_ROOT="$(dirname "$GRADLEW")"

          echo "Gradle project found at: $SOURCE_ROOT"

          test -f "$SOURCE_ROOT/gradlew"
          test -d "$SOURCE_ROOT/app"
          test -d "$SOURCE_ROOT/gradle"

          echo "Gradle template ready"

      - name: Patch Android server notifications
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$(find android/build -type f -path '*/src/main/AndroidManifest.xml' -print -quit)"

          if [ -z "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            find android/build -type f -name AndroidManifest.xml
            exit 1
          fi

          echo "Manifest found: $MANIFEST"

          JAVA_SOURCE="addons/khvataika_background_notifications/KhvataikaAlarmReceiver.java"

          test -f "$JAVA_SOURCE"

          JAVA_TARGET="$(dirname "$MANIFEST")/java/com/clawneon/khvataika/KhvataikaAlarmReceiver.java"

          mkdir -p "$(dirname "$JAVA_TARGET")"

          cp "$JAVA_SOURCE" "$JAVA_TARGET"

          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          path = Path(sys.argv[1])
          text = path.read_text()

          if 'android:usesCleartextTraffic="true"' not in text:
              pos = text.find("<application")
              end = text.find(">", pos)

              if pos < 0 or end < 0:
                  raise SystemExit("Application tag not found")

              text = (
                  text[:end]
                  + ' android:usesCleartextTraffic="true"'
                  + text[end:]
              )

          receiver = """
                  <receiver
                      android:name="com.clawneon.khvataika.KhvataikaAlarmReceiver"
                      android:enabled="true"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>
          """

          if "com.clawneon.khvataika.KhvataikaAlarmReceiver" not in text:
              close = text.rfind("</application>")

              if close < 0:
                  raise SystemExit("Application closing tag not found")

              text = text[:close] + receiver + text[close:]

          path.write_text(text)

          ET.parse(path)

          print("AndroidManifest.xml is valid")
          PY

          test -f "$JAVA_TARGET"

          echo "Server notification receiver installed"

      - name: Check project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot
          test -f export_presets.cfg

          grep -q 'name="Android RuStore AAB"' export_presets.cfg

          echo "Project configuration OK"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUSTORE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
        run: |
          set -euo
