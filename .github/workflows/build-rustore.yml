name: Build Khvataika AAB

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    env:
      GODOT_VERSION: '4.7.2'
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
      KEYSTORE_PATH: ${{ github.workspace }}/release.keystore

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Java and Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless wget unzip

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
            -O /tmp/cmdline-tools.zip

          unzip -q /tmp/cmdline-tools.zip -d /tmp/cmdline-tools

          rm -rf "$ANDROID_HOME/cmdline-tools/latest"

          mv \
            /tmp/cmdline-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.1.0"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Download Godot 4.7.2 and export templates
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$HOME/godot"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" \
            -O /tmp/godot.zip

          unzip -q /tmp/godot.zip -d "$HOME/godot"

          mv \
            "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            "$HOME/godot/godot"

          chmod +x "$HOME/godot/godot"

          mkdir -p \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"

          wget -q \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" \
            -O /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -q \
            /tmp/templates.tpz \
            -d /tmp/godot_templates

          cp -R \
            /tmp/godot_templates/templates/. \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

          test -f \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_release.apk"

          test -f \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_debug.apk"

          test -f \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/android_source.zip"

          echo "Godot and export templates ready"

      - name: Check project files before export
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Project files ==="

          test -f project.godot
          test -f VERSION.txt
          test -f export_presets.cfg
          test -f scenes/Main.tscn
          test -f scripts/main.gd

          test -f assets/loading_miniature.png
          test -s assets/loading_miniature.png

          test -f audio/claw_move.wav
          test -s audio/claw_move.wav

          echo "=== Asset information ==="

          ls -lh \
            assets/loading_miniature.png \
            audio/claw_move.wav

          file \
            assets/loading_miniature.png \
            audio/claw_move.wav

          echo "=== SHA256 ==="

          sha256sum \
            assets/loading_miniature.png \
            audio/claw_move.wav

          echo "=== Version ==="

          VERSION="$(tr -d '[:space:]' < VERSION.txt)"
          test "$VERSION" = "1.13.6"

          echo "Project version: $VERSION"
          echo "Project files OK"

      - name: Check project configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f project.godot

          test -f VERSION.txt
          test "$(tr -d '[:space:]' < VERSION.txt)" = "1.13.6"

          test -f export_presets.cfg

          grep -q 'name="Android RuStore AAB"' export_presets.cfg

          grep -q 'config/version="1.13.6"' project.godot

          grep -q 'version/name="1.13.6"' export_presets.cfg

          grep -q \
            'export_path="build/rustore/khvataika-1.13.6.aab"' \
            export_presets.cfg

          grep -q \
            'textures/vram_compression/import_etc2_astc=true' \
            project.godot

          test -f audio/claw_move.wav
          test -s audio/claw_move.wav

          echo "Project configuration OK"

      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RUSTORE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RUSTORE_KEY_ALIAS }}
        run: |
          set -euo pipefail

          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"

          printf '%s' "$KEYSTORE_B64" \
            | base64 --decode \
            > "$KEYSTORE_PATH"

          test -s "$KEYSTORE_PATH"

          keytool \
            -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            >/dev/null

          echo "Release keystore verified"

      - name: Export signed RuStore AAB
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RUSTORE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          rm -rf android
          mkdir -p build/rustore

          echo "Installing Android Gradle template and exporting AAB..."

          "$HOME/godot/godot" \
            --headless \
            --path . \
            --install-android-build-template \
            --export-release \
            "Android RuStore AAB" \
            "build/rustore/khvataika-1.13.6.aab"

          test -s build/rustore/khvataika-1.13.6.aab

          file build/rustore/khvataika-1.13.6.aab

          echo "AAB export completed successfully"

      - name: Patch Android server notifications safely
        shell: bash
        run: |
          set -euo pipefail

          MANIFEST="$(find android/build -path '*/src/main/AndroidManifest.xml' -print -quit)"

          JAVA_SOURCE="addons/khvataika_background_notifications/KhvataikaAlarmReceiver.java"

          test -n "$MANIFEST"
          test -f "$JAVA_SOURCE"

          JAVA_TARGET="$(dirname "$MANIFEST")/java/com/clawneon/khvataika/KhvataikaAlarmReceiver.java"

          mkdir -p "$(dirname "$JAVA_TARGET")"

          cp "$JAVA_SOURCE" "$JAVA_TARGET"

          python3 -c '
          from pathlib import Path
          import sys

          p = Path(sys.argv[1])
          s = p.read_text()

          pos = s.find("<application")
          end = s.find(">", pos)

          assert pos >= 0
          assert end >= 0

          if "android:usesCleartextTraffic=\"true\"" not in s:
              s = (
                  s[:end]
                  + " android:usesCleartextTraffic=\"true\""
                  + s[end:]
              )

          receiver = "\n".join([
              "",
              "        <receiver",
              "            android:name=\"com.clawneon.khvataika.KhvataikaAlarmReceiver\"",
              "            android:enabled=\"true\"",
              "            android:exported=\"false\">",
              "            <intent-filter>",
              "                <action android:name=\"android.intent.action.BOOT_COMPLETED\" />",
              "                <action android:name=\"android.intent.action.MY_PACKAGE_REPLACED\" />",
              "            </intent-filter>",
              "        </receiver>",
              ""
          ])

          close = s.rfind("</application>")
          assert close >= 0

          if "com.clawneon.khvataika.KhvataikaAlarmReceiver" not in s:
              s = s[:close] + receiver + s[close:]

          p.write_text(s)
          ' "$MANIFEST"

          python3 -c '
          import sys
          import xml.etree.ElementTree as ET

          ET.parse(sys.argv[1])

          print("AndroidManifest.xml valid")
          ' "$MANIFEST"

          test -f "$JAVA_TARGET"

          echo "Android server notification receiver patched"

            - name: Build signed APK after Android patch
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ env.KEYSTORE_PATH }}
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.RUSTORE_KEY_ALIAS }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.RUSTORE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          rm -f build/rustore/khvataika-1.13.6.apk
          mkdir -p build/rustore

          echo "Exporting final signed APK..."

          "$HOME/godot/godot" \
            --headless \
            --path . \
            --export-release \
            "Android" \
            "build/rustore/khvataika-1.13.6.apk"

          test -s build/rustore/khvataika-1.13.6.apk

          file build/rustore/khvataika-1.13.6.apk

          echo "Final APK export completed"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: khvataika-1.13.6-apk
          path: build/rustore/khvataika-1.13.6.apk
          if-no-files-found: error
          retention-days: 14
