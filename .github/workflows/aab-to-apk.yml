name: Convert AAB to APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download bundletool
        run: |
          wget -q https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar \
            -O bundletool.jar

      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -keystore debug.keystore \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Convert AAB to universal APK
        run: |
          java -jar bundletool.jar build-apks \
            --bundle=khvataika-1.13.6.aab \
            --output=khvataika-1.13.6.apks \
            --mode=universal \
            --ks=debug.keystore \
            --ks-pass=pass:android \
            --ks-key-alias=androiddebugkey \
            --key-pass=pass:android

      - name: Extract APK
        run: |
          mkdir -p apk
          unzip -j khvataika-1.13.6.apks universal.apk -d apk
          mv apk/universal.apk apk/khvataika-1.13.6-universal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: khvataika-1.13.6-APK
          path: apk/khvataika-1.13.6-universal.apk
