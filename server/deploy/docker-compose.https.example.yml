services:
  api:
    build: ..
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      HOST: 0.0.0.0
      PORT: 8080
    expose:
      - "8080"
    volumes:
      - ../data:/app/data

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.docker.example:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:
