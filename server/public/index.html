<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Хватайка — Админ-панель</title>
<style>
:root{--bg:#100b08;--panel:#201712;--card:#2b1e17;--line:#76583f;--cream:#e5c39a;--text:#f4e7d8;--muted:#bca996;--gold:#ffd65a;--ok:#9ed39a;--danger:#d98d78}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#2b1b12 0,#100b08 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;background:#6e4b33;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 14px}button:hover{background:#856344}.wrap{max-width:1280px;margin:auto;padding:20px}.brand{font-size:28px;font-weight:800;color:var(--cream)}.sub,.muted{color:var(--muted)}.login,.panel{background:rgba(32,23,18,.96);border:2px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 12px 40px #0006}.login{max-width:480px;margin:70px auto}.field{display:grid;gap:6px;margin:10px 0}.field label{color:var(--muted);font-size:13px}.field input,.field textarea,.field select{width:100%;background:#17100c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px}.field textarea{min-height:90px;resize:vertical}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px}.tabs{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}.tabs button.active{background:#9a7653;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px}.card h3{margin:0 0 12px;color:var(--cream)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between;margin:7px 0}.list{display:grid;gap:9px}.item{background:#1b130f;border:1px solid #604833;border-radius:10px;padding:12px}.item strong{color:var(--cream)}.actions{display:flex;gap:8px;flex-wrap:wrap}.danger{border-color:#8d5a46;background:#4d2920}.ok{color:var(--ok)}.wide{grid-column:1/-1}.stat{font-size:28px;font-weight:800;color:var(--cream)}.badge{display:inline-block;padding:3px 8px;border-radius:99px;background:#4d3626;color:var(--cream);font-size:12px}.search{display:flex;gap:8px;margin-bottom:12px}.search input{flex:1;background:#17100c;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px}.hidden{display:none}@media(max-width:760px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.top{align-items:flex-start;flex-direction:column}.stat{font-size:23px}}
</style></head><body><div class="wrap" id="app"></div><script>
const app=document.getElementById('app');let token='';let state=null;let tab='dashboard';let playerFilter='';
const api=(path,opt={})=>fetch(path,{...opt,credentials:'same-origin',headers:{'Content-Type':'application/json',...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})}}).then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.message||'Ошибка');return d});
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function login(){app.innerHTML=`<div class="login"><div class="brand">🎮 ХВАТАЙКА</div><div class="sub">Полноценная панель управления серверной игрой</div><div class="field"><label>Пароль администратора</label><input id="pw" type="password" onkeydown="if(event.key==='Enter')doLogin()"></div><button onclick="doLogin()">ВОЙТИ</button><div id="msg" class="muted" style="margin-top:10px"></div></div>`}
async function doLogin(){try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})});token=d.token;await load()}catch(e){document.getElementById('msg').textContent=e.message}}
async function load(){const d=await api('/api/admin/state');state=d.state;render()}
function render(){app.innerHTML=`<div class="top"><div><div class="brand">🎮 ХВАТАЙКА — АДМИН-ПАНЕЛЬ</div><div class="sub">Игроки • экономика • контент • события • рейтинг • сезон • сундуки • журнал</div></div><button onclick="token='';state=null;login()">ВЫЙТИ</button></div><div class="tabs">${[['dashboard','Обзор'],['players','Игроки'],['promo','Промокоды'],['news','Новости'],['events','События'],['economy','Экономика'],['season','Сезон'],['chests','Сундуки'],['rating','Рейтинг'],['notifications','Уведомления'],['logs','Журнал']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()">${x[1]}</button>`).join('')}</div><div class="panel">${view()}</div>`}
function view(){return ({dashboard,players,promo,news,events,economy,season,chests,rating,notifications,logs}[tab]||dashboard)()}
function dashboard(){const ps=Object.values(state.players||{});return `<div class="grid"><div class="card"><h3>Игроки</h3><div class="stat">${ps.length}</div><div class="muted">Всего зарегистрированных</div></div><div class="card"><h3>Активные промокоды</h3><div class="stat">${(state.promocodes||[]).filter(x=>x.active).length}</div><div class="muted">Из ${(state.promocodes||[]).length} созданных</div></div><div class="card"><h3>Контент</h3><div>📰 Новостей: <b>${(state.news||[]).length}</b></div><div>🎪 Событий: <b>${(state.events||[]).length}</b></div><div>🎁 Сундуков: <b>${(state.chests||[]).length}</b></div></div><div class="card"><h3>Быстрые действия</h3><div class="actions"><button onclick="tab='promo';addPromo();render()">+ ПРОМОКОД</button><button onclick="tab='news';addNews();render()">+ НОВОСТЬ</button><button onclick="tab='events';addEvent();render()">+ СОБЫТИЕ</button></div></div><div class="card wide"><h3>Состояние сервера</h3><div class="row"><span>Технические работы</span><b>${state.settings?.maintenance_mode?'🔴 ВКЛ':'🟢 ВЫКЛ'}</b></div><div class="row"><span>Множитель наград</span><b>×${state.settings?.global_reward_multiplier??1}</b></div><div class="row"><span>Объявление</span><span class="muted">${esc(state.settings?.global_announcement||'нет')}</span></div></div></div>`}
function players(){let rows=Object.values(state.players||{}).sort((a,b)=>(b.score||0)-(a.score||0));if(playerFilter)rows=rows.filter(p=>(p.name||'').toLowerCase().includes(playerFilter.toLowerCase())||String(p.player_id).includes(playerFilter));return `<div class="search"><input placeholder="Поиск по имени или ID" value="${esc(playerFilter)}" oninput="playerFilter=this.value;render()"><button onclick="load()">ОБНОВИТЬ</button></div><div class="list">${rows.map((p,i)=>`<div class="item"><div class="row"><strong>#${i+1} ${esc(p.name||'ИГРОК')}</strong><span class="badge">${p.banned?'🔴 ЗАБЛОКИРОВАН':'🟢 АКТИВЕН'}</span></div><div class="muted">ID: ${esc(p.player_id)}</div><div>Рейтинг: <b>${p.score||0}</b> • Ур. ${p.level||1} • Игр ${p.games||0} • Призов ${p.prizes||0} • Баланс ${p.coins||0} ₽</div><div class="actions" style="margin-top:8px"><button onclick="playerAction(${JSON.stringify(p.player_id)},'${p.banned?'unban':'ban'}')">${p.banned?'РАЗБЛОКИРОВАТЬ':'ЗАБЛОКИРОВАТЬ'}</button><button onclick="setCoins(${JSON.stringify(p.player_id)})">БАЛАНС</button><button onclick="setScore(${JSON.stringify(p.player_id)},${p.score||0})">РЕЙТИНГ</button></div></div>`).join('')||'<div class="muted">Игроков пока нет.</div>'}</div>`}
async function playerAction(id,action){try{await api('/api/admin/player',{method:'POST',body:JSON.stringify({player_id:id,action})});await load()}catch(e){alert(e.message)}}
async function setCoins(id){const c=prompt('Новый баланс ₽');if(c===null)return;try{await api('/api/admin/player',{method:'POST',body:JSON.stringify({player_id:id,action:'set_coins',coins:Number(c)})});await load()}catch(e){alert(e.message)}}
async function setScore(id,current){const c=prompt('Новый рейтинг',current);if(c===null)return;try{await api('/api/admin/player',{method:'POST',body:JSON.stringify({player_id:id,action:'set_score',score:Number(c)})});await load()}catch(e){alert(e.message)}}
function promo(){return `<div class="actions"><button onclick="addPromo()">+ ДОБАВИТЬ</button><button onclick="saveAll()">СОХРАНИТЬ</button></div><div class="list" style="margin-top:12px">${(state.promocodes||[]).map((p,i)=>`<div class="item"><div class="row"><strong>${esc(p.code)}</strong><label><input type="checkbox" ${p.active?'checked':''} onchange="state.promocodes[${i}].active=this.checked"> Активен</label></div><div class="grid"><div class="field"><label>Награда ₽</label><input type="number" value="${p.reward}" onchange="state.promocodes[${i}].reward=this.value"></div><div class="field"><label>Лимит (0 = без лимита)</label><input type="number" value="${p.max_uses}" onchange="state.promocodes[${i}].max_uses=this.value"></div><div class="field"><label>Срок ISO</label><input value="${esc(p.expires||'')}" onchange="state.promocodes[${i}].expires=this.value"></div><div class="field"><label>Использовано</label><input type="number" value="${p.used||0}" onchange="state.promocodes[${i}].used=this.value"></div></div><button class="danger" onclick="state.promocodes.splice(${i},1);render()">Удалить</button></div>`).join('')}</div>`}
function addPromo(){state.promocodes.push({code:'NEWCODE',reward:100,max_uses:0,used:0,active:true,expires:''});render()}
function news(){return `<div class="actions"><button onclick="addNews()">+ ДОБАВИТЬ</button><button onclick="saveAll()">СОХРАНИТЬ</button></div><div class="list" style="margin-top:12px">${(state.news||[]).map((n,i)=>`<div class="item"><div class="grid"><div class="field"><label>Дата</label><input value="${esc(n.date)}" onchange="state.news[${i}].date=this.value"></div><div class="field"><label>Тип</label><select onchange="state.news[${i}].type=this.value"><option ${n.type==='news'?'selected':''}>news</option><option ${n.type==='update'?'selected':''}>update</option><option ${n.type==='promo'?'selected':''}>promo</option><option ${n.type==='event'?'selected':''}>event</option></select></div><div class="field wide"><label>Заголовок</label><input value="${esc(n.title)}" onchange="state.news[${i}].title=this.value"></div><div class="field wide"><label>Текст</label><textarea onchange="state.news[${i}].text=this.value">${esc(n.text)}</textarea></div></div><button class="danger" onclick="state.news.splice(${i},1);render()">Удалить</button></div>`).join('')}</div>`}
function addNews(){state.news.unshift({id:String(Date.now()),date:new Date().toLocaleDateString('ru-RU'),type:'news',title:'🆕 Новость',text:'Введите текст новости.'});render()}
function events(){return `<div class="actions"><button onclick="addEvent()">+ ДОБАВИТЬ</button><button onclick="saveAll()">СОХРАНИТЬ</button></div><div class="list" style="margin-top:12px">${(state.events||[]).map((e,i)=>`<div class="item"><div class="grid"><div class="field"><label>Название</label><input value="${esc(e.name)}" onchange="state.events[${i}].name=this.value"></div><div class="field"><label>Окончание Unix</label><input type="number" value="${e.end_unix||0}" onchange="state.events[${i}].end_unix=this.value"></div><div class="field wide"><label>Описание</label><textarea onchange="state.events[${i}].description=this.value">${esc(e.description||'')}</textarea></div><div class="field"><label>Бонус шанса</label><input type="number" step="0.01" value="${e.bonus||0}" onchange="state.events[${i}].bonus=this.value"></div><div class="field"><label>Множитель награды</label><input type="number" step="0.1" value="${e.reward_mult||1}" onchange="state.events[${i}].reward_mult=this.value"></div></div><label><input type="checkbox" ${e.active?'checked':''} onchange="state.events[${i}].active=this.checked"> Активно</label> <button class="danger" onclick="state.events.splice(${i},1);render()">Удалить</button></div>`).join('')}</div>`}
function addEvent(){state.events.push({id:String(Date.now()),name:'🎪 Новое событие',description:'',end_unix:Math.floor(Date.now()/1000)+86400,bonus:0.05,reward_mult:1.2,active:false});render()}
function economy(){const s=state.settings||{};return `<div class="grid"><div class="card"><h3>Награды</h3>${num('global_reward_multiplier','Общий множитель',s.global_reward_multiplier,0.1,10,.1)}${num('daily_bonus_amount','Ежедневный бонус ₽',s.daily_bonus_amount,0,100000,1)}${num('daily_mission_reward','Ежедневная миссия ₽',s.daily_mission_reward,0,100000,1)}${num('weekly_mission_reward','Недельная миссия ₽',s.weekly_mission_reward,0,100000,1)}</div><div class="card"><h3>Возвращение</h3>${num('return_bonus_base','Базовый бонус ₽',s.return_bonus_base,0,100000,1)}${num('return_bonus_per_day','За день ₽',s.return_bonus_per_day,0,100000,1)}${num('return_bonus_max_days','Максимум дней',s.return_bonus_max_days,1,90,1)}</div><div class="card wide"><h3>Сервер</h3>${bool('maintenance_mode','Технические работы',s.maintenance_mode)}<div class="field"><label>Объявление</label><textarea id="announcement">${esc(s.global_announcement||'')}</textarea></div></div></div><div class="actions" style="margin-top:14px"><button onclick="collectSettings();saveAll()">СОХРАНИТЬ</button></div>`}
function num(k,l,v,min,max,step){return `<div class="field"><label>${l}</label><input data-setting="${k}" type="number" value="${v??0}" min="${min}" max="${max}" step="${step}"></div>`}function bool(k,l,v){return `<label><input id="b_${k}" type="checkbox" ${v?'checked':''}> ${l}</label>`}function collectSettings(){const s=state.settings;s.maintenance_mode=document.getElementById('b_maintenance_mode').checked;s.global_announcement=document.getElementById('announcement').value;document.querySelectorAll('[data-setting]').forEach(e=>{const k=e.dataset.setting;s[k]=Number(e.value)})}
function season(){const s=state.season||{name:'Сезон 1',max_level:30,levels:[]};return `<div class="card"><h3>🎟 Сезонный пропуск</h3><div class="grid"><div class="field"><label>Название</label><input id="season_name" value="${esc(s.name)}"></div><div class="field"><label>Максимальный уровень</label><input id="season_max" type="number" value="${s.max_level||30}"></div></div><div class="list">${Array.from({length:Number(s.max_level||30)},(_,i)=>{let r=(s.levels||[])[i]||{level:i+1,reward:'',type:'рубли'};return `<div class="item"><div class="grid"><div class="field"><label>Уровень</label><input type="number" value="${i+1}" disabled></div><div class="field"><label>Тип награды</label><input data-sl-type="${i}" value="${esc(r.type||'рубли')}"></div><div class="field wide"><label>Награда</label><input data-sl-reward="${i}" value="${esc(r.reward||'')}"></div></div></div>`}).join('')}</div><div class="actions" style="margin-top:12px"><button onclick="saveSeason()">СОХРАНИТЬ СЕЗОН</button></div></div>`}
async function saveSeason(){const max=Math.max(1,Math.min(100,Number(document.getElementById('season_max').value||30)));const levels=[];for(let i=0;i<max;i++)levels.push({level:i+1,type:document.querySelector(`[data-sl-type="${i}"]`)?.value||'рубли',reward:document.querySelector(`[data-sl-reward="${i}"]`)?.value||''});state.season={name:document.getElementById('season_name').value,max_level:max,levels};await saveAll()}
function chests(){return `<div class="actions"><button onclick="addChest()">+ ДОБАВИТЬ СУНДУК</button><button onclick="saveAll()">СОХРАНИТЬ</button></div><div class="list" style="margin-top:12px">${(state.chests||[]).map((c,i)=>`<div class="item"><div class="grid"><div class="field"><label>Название</label><input value="${esc(c.name)}" onchange="state.chests[${i}].name=this.value"></div><div class="field"><label>Стоимость ключа</label><input type="number" value="${c.key_cost||1}" onchange="state.chests[${i}].key_cost=this.value"></div><div class="field wide"><label>Содержимое / таблица наград</label><textarea onchange="state.chests[${i}].rewards=this.value">${esc(c.rewards||'')}</textarea></div></div><button class="danger" onclick="state.chests.splice(${i},1);render()">Удалить</button></div>`).join('')}</div>`}
function addChest(){state.chests.push({id:String(Date.now()),name:'📦 Новый сундук',key_cost:1,rewards:'100 ₽ — 40%\n250 ₽ — 30%\nКлюч — 20%\nДеталь — 10%'});render()}
function rating(){const rows=Object.values(state.players||{}).filter(p=>!p.banned).sort((a,b)=>(b.score||0)-(a.score||0));return `<div class="card"><h3>🏆 Общий рейтинг</h3><div class="list">${rows.map((p,i)=>`<div class="item"><b>#${i+1}</b> ${esc(p.name||'ИГРОК')} — <strong>${p.score||0}</strong> очков • ур. ${p.level||1}</div>`).join('')||'<div class="muted">Рейтинг пока пуст.</div>'}</div></div>`}
function notifications(){const n=state.settings?.notification_hours||{};return `<div class="grid"><div class="card"><h3>🔔 Время уведомлений</h3>${hour('rewards','Награды',n.rewards??12)}${hour('streak','Серия',n.streak??20)}${hour('chests','Сундуки',n.chests??18)}<div class="actions" style="margin-top:12px"><button onclick="saveNotificationHours()">СОХРАНИТЬ</button></div></div><div class="card"><h3>📨 Отправить серверное уведомление</h3><div class="field"><label>ID игрока (пусто = всем)</label><input id="notify_player" placeholder="all"></div><div class="field"><label>Заголовок</label><input id="notify_title" value="🎮 Хватайка"></div><div class="field"><label>Сообщение</label><textarea id="notify_message">Зайди в игру — тебя ждёт награда!</textarea></div><div class="actions"><button onclick="sendServerNotification()">ОТПРАВИТЬ</button></div><div class="muted" style="margin-top:8px">Уведомление попадёт в серверную очередь и будет доставлено приложению даже после закрытия игры.</div></div><div class="card wide"><h3>История очереди</h3><div class="list">${(state.notifications||[]).slice(-50).reverse().map(x=>`<div class="item"><strong>${esc(x.title)}</strong> • ${esc(x.target)}<div>${esc(x.message)}</div><div class="muted">${esc(x.created_at)}</div></div>`).join('')||'<div class="muted">Очередь пока пуста.</div>'}</div></div></div>`}function hour(k,l,v){return `<div class="field"><label>${l}</label><input data-hour="${k}" type="number" min="0" max="23" value="${v}"></div>`}function saveNotificationHours(){state.settings.notification_hours={rewards:Number(document.querySelector('[data-hour="rewards"]').value),streak:Number(document.querySelector('[data-hour="streak"]').value),chests:Number(document.querySelector('[data-hour="chests"]').value)};saveAll()}async function sendServerNotification(){try{const target=document.getElementById('notify_player').value.trim()||'all';const title=document.getElementById('notify_title').value.trim();const message=document.getElementById('notify_message').value.trim();if(!title||!message){alert('Заполните заголовок и сообщение');return}await api('/api/admin/notify',{method:'POST',body:JSON.stringify({player_id:target,title,message,kind:'admin'})});await load();tab='notifications';render();alert('Уведомление отправлено в очередь')}catch(e){alert(e.message)}}
function logs(){return `<div class="list">${(state.audit||[]).map(x=>`<div class="item"><strong>${esc(x.action)}</strong><div class="muted">${esc(x.at)}</div><pre>${esc(JSON.stringify(x.meta))}</pre></div>`).join('')||'<div class="muted">Журнал пуст.</div>'}</div>`}
async function saveAll(){try{await api('/api/admin/state',{method:'POST',body:JSON.stringify({settings:state.settings,promocodes:state.promocodes,news:state.news,events:state.events,season:state.season,chests:state.chests})});await load();alert('Сохранено')}catch(e){alert(e.message)}}
login();
</script></body></html>
